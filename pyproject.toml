[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfos"
version = "0.5.0"
description = "A personal knowledge system for the AI era"
requires-python = ">=3.10"
dependencies = ["argon2-cffi>=23.1,<26"]

[project.scripts]
selfos-serve = "selfos.app.cli:serve"
selfos-knowledge = "selfos.app.cli:knowledge"
selfos-harvest = "selfos.app.cli:harvest"
selfos-auth = "selfos.app.cli:auth"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"selfos.resources" = ["locales/*/*.json", "templates/*.md", "skills/digest/*.md"]
