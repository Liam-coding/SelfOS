name: macOS compatibility

on:
  pull_request:
  push:
    branches: [investigation/macos-compatibility]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record actual platform
        run: |
          mkdir -p reports
          sw_vers | tee reports/platform.txt
          uname -m | tee -a reports/platform.txt
          python --version | tee -a reports/platform.txt
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Run synthetic regressions
        run: python -m pytest -q --tb=short --junitxml=reports/pytest.xml | tee reports/pytest.log
      - name: Build and install wheel independently
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m pip install --target "$RUNNER_TEMP/selfos-installed" dist/*.whl
      - name: Verify installed commands, storage and authenticated HTTP
        run: python tools/verify_platform.py "$RUNNER_TEMP/selfos-installed" | tee reports/installed.log
      - name: Install browser verification dependencies
        run: |
          python -m pip install playwright
          python -m playwright install chromium webkit
      - name: Verify Chromium and WebKit UI with fixtures
        run: |
          python tools/verify_browser.py "$RUNNER_TEMP/selfos-installed" reports chromium | tee reports/chromium.log
          python tools/verify_browser.py "$RUNNER_TEMP/selfos-installed" reports webkit | tee reports/webkit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
