name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Determine whether code changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              run_tests = True
          else:
              base = os.environ['BEFORE_SHA'] if os.environ['EVENT_NAME'] == 'push' else 'HEAD^'
              def documentation(path):
                  return path in {'README.md', 'README.zh-CN.md', 'LICENSE'} or path.startswith('docs/')
              try:
                  files = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              except subprocess.CalledProcessError:
                  run_tests = True
              else:
                  run_tests = any(not documentation(path) for path in files)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('run_tests=' + str(run_tests).lower() + '\n')
          if not run_tests:
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write('Documentation-only change: unit tests were not needed.\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.changes.outputs.run_tests == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install test dependencies
        if: steps.changes.outputs.run_tests == 'true'
        run: python -m pip install -e . pytest
      - name: Run synthetic unit and contract tests
        if: steps.changes.outputs.run_tests == 'true'
        run: python -m pytest -q --tb=short
