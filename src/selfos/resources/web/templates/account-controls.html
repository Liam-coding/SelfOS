<div id="auth-account-buttons"><button type="button" class="settings-action" data-selfos-action="account.change" data-i18n="auth.change"></button><button type="button" class="settings-action settings-signout" data-selfos-action="account.logout" data-i18n="auth.logout"></button><p id="auth-account-status" role="status"></p></div>
<dialog id="auth-change" class="auth-card"><h2 data-i18n="auth.change"></h2><p data-i18n="auth.change_hint"></p>
<form data-selfos-action="account.save"><label><span data-i18n="auth.current"></span><input id="auth-current" type="password" autocomplete="current-password" required maxlength="1024"></label>
<label><span data-i18n="auth.new"></span><input id="auth-new" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label>
<label><span data-i18n="auth.confirm"></span><input id="auth-new-confirm" type="password" autocomplete="new-password" required maxlength="1024"></label>
<p id="auth-change-status" role="status"></p><button type="submit" data-i18n="auth.change"></button><button type="button" data-selfos-action="account.close" data-i18n="auth.close"></button></form></dialog>
