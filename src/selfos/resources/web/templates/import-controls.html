<button class="harvest-btn" onclick="openKnowledgeSettings()" data-i18n="ui.import_settings.import_settings">Import settings</button>
@@SELFOS_RESOURCE:templates/uploads.html@@
<dialog id="knowledge-settings" style="background:var(--bg,#fff);color:var(--text,#222);border-radius:16px;max-width:560px;padding:24px">
  <h3 data-i18n="ui.import_settings.knowledge_import_settings">Knowledge import settings</h3>
  <p data-i18n="ui.import_settings.focus_domains_determine_what_to_retain_original_conversations_are_preserved_detail_co">Focus domains determine what to retain. Original conversations are preserved. Detail controls how much context to keep, not the number of records.</p>
  <div id="knowledge-domains"></div>
  <p><label><span data-i18n="ui.import_settings.custom_domains_comma_separated">Custom domains (comma-separated)</span> <input id="knowledge-custom" placeholder="For example: music, travel" data-i18n-placeholder="ui.import_settings.custom_placeholder"></label></p>
  <p><label><span data-i18n="ui.import_settings.detail_level">Detail level</span> <select id="knowledge-detail"><option value="concise" data-i18n="ui.import_settings.concise">Concise</option><option value="balanced" data-i18n="ui.import_settings.balanced">Balanced</option><option value="detailed" data-i18n="ui.import_settings.detailed">Detailed</option></select></label></p>
  <p id="knowledge-status" role="status"></p>
  @@SELFOS_RESOURCE:templates/workload.html@@
  <button onclick="saveKnowledgeSettings(false)" data-i18n="ui.import_settings.save_settings">Save settings</button>
  <button onclick="saveKnowledgeSettings(true)" data-i18n="ui.import_settings.save_and_rebuild">Save and rebuild</button>
  <button id="knowledge-undo" onclick="undoKnowledge()" data-i18n="ui.import_settings.undo_last_import">Undo last import</button>
  <button onclick="document.getElementById('knowledge-settings').close()" data-i18n="ui.import_settings.close">Close</button>
</dialog>
<script>@@SELFOS_RESOURCE:scripts/import-controls.js@@
@@SELFOS_RESOURCE:scripts/workload.js@@</script>
