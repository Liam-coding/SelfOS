
<style>@@SELFOS_RESOURCE:styles/settings-model.css@@</style>
<div id="model-settings-entry" style="display:inline-flex">
  <button class="harvest-btn" onclick="openAppSettings()" data-i18n="ui.model.settings">⚙ Settings</button>
</div>
<dialog id="app-settings" style="margin:auto;background:var(--bg,#fff);color:var(--text,#222);border:1px solid var(--line,#ccc);border-radius:16px;padding:28px;width:min(440px,90vw)">
  <h3 data-i18n="ui.model.settings_button">Settings</h3>
  <button type="button" class="harvest-btn" onclick="document.getElementById('app-settings').close();onboardingResumeSetup()" data-i18n="onboarding.resume_setup">Resume setup</button>
  <p style="margin:20px 0"><label><span data-i18n="ui.model.language">Language</span>
    <select id="settings-language" onchange="setSettingsLanguage(this.value)" style="padding:10px;border-radius:8px"></select></label></p>
  <button class="harvest-btn" onclick="document.getElementById('app-settings').close();openModelSettings()" data-i18n="ui.model.model_and_network">Model and network</button>
  <p id="current-model" style="font-size:12px;margin:16px 0" aria-live="polite"></p>
  <button class="harvest-btn" onclick="document.getElementById('app-settings').close()" data-i18n="ui.model.close">Close</button>
</dialog>
<dialog id="model-settings" style="background:var(--surface,#fff);color:var(--text,#222);border:1px solid var(--line,#ccc);border-radius:16px;padding:24px;width:min(540px,90vw)">
  <h3 data-i18n="ui.model.model_and_network">Model and network</h3>
  <p data-i18n="ui.model.imports_project_refinement_and_chat_share_this_configuration_keys_stay_o">Imports, project refinement and chat share this configuration. Keys stay on the local server. Leave the key blank to keep it.</p>
  <form onsubmit="event.preventDefault();saveModelSettings(false)">
    <p><label><span data-i18n="ui.model.interface">Interface</span> <select id="model-provider" onchange="changeModelProvider()"><option value="anthropic" data-i18n="ui.model.anthropic_messages">Anthropic Messages</option><option value="openai" data-i18n="ui.model.openai_compatible">OpenAI-compatible</option></select></label></p>
    <p><label><span data-i18n="ui.model.base_url">Base URL</span> <input id="model-base" type="url" required style="width:100%"></label></p>
    <p><label><span data-i18n="ui.model.model_name">Model name</span> <input id="model-name" required placeholder="For example: claude-haiku-4-5-20251001 / gpt-4.1-mini" data-i18n-placeholder="ui.model.name_placeholder" style="width:100%"></label></p>
    <p><label><span data-i18n="ui.model.api_key">API key</span> <input id="model-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the saved key" data-i18n-placeholder="ui.model.key_placeholder" style="width:100%"></label></p>
    <p><label><input id="model-clear-key" type="checkbox"><span data-i18n="ui.model.clear_saved_key_optional_for_local_models">Clear saved key (optional for local models)</span></label></p>
    <p><label><span data-i18n="ui.model.proxy">Proxy</span> <select id="model-proxy-mode" onchange="updateModelProxy()"><option value="auto" data-i18n="ui.model.auto_environment_system_proxy">Auto: environment / system proxy</option><option value="manual" data-i18n="ui.model.manual_http_s_proxy">Manual HTTP(S) proxy</option><option value="direct" data-i18n="ui.model.direct">Direct</option></select></label></p>
    <p id="model-proxy-row"><label><span data-i18n="ui.model.proxy_url">Proxy URL</span> <input id="model-proxy-url" placeholder="http://127.0.0.1:7890" style="width:100%"></label></p>
    <p data-i18n="ui.model.local_models_connect_directly_auto_uses_environment_variables_then_the_w">Local models connect directly. Auto uses environment variables, then the Windows static proxy. PAC scripts are not supported.</p>
    <p id="model-status" role="status" style="white-space:pre-wrap"></p>
    <button type="submit" data-i18n="ui.model.save">Save</button>
    <button type="button" onclick="saveModelSettings(true)" data-i18n="ui.model.save_and_test_connection">Save and test connection</button>
    <button type="button" onclick="document.getElementById('model-settings').close()" data-i18n="ui.model.close">Close</button>
  </form>
</dialog>
<script>@@SELFOS_RESOURCE:scripts/settings-model.js@@</script>
