</head><body><main class="auth-card">
<strong style="font-size:28px;letter-spacing:-1px">SelfOS</strong>
<select id="auth-language" aria-label="Language" data-i18n-aria-label="ui.common.language"></select>
<h1 id="auth-heading" data-i18n="auth.title"></h1><p id="auth-description" data-i18n="auth.description"></p>
<form id="auth-form" hidden><label><span data-i18n="auth.password"></span><input id="auth-password" type="password" autocomplete="current-password" required maxlength="1024"></label>

<p id="auth-length" data-i18n="auth.length" hidden></p><button id="auth-submit" type="submit" data-i18n="auth.login"></button></form>
<section id="auth-recovery" hidden><p data-i18n="auth.recovery"></p><code>python -m selfos auth reset</code></section>
<p id="auth-status" role="status"></p></main>
